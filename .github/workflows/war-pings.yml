name: war-pings

on:
  schedule:
    - cron: '55 0 * * *'    # 08:55 KL — D-COUNT
    - cron: '30 4 * * *'    # 12:30 KL — MIDCHECK
    - cron: '55 5 * * *'    # 13:55 KL — BLOCK-1 warning
    - cron: '25 7 * * *'    # 15:25 KL — BLOCK-1 close
    - cron: '25 9 * * *'    # 17:25 KL — BLOCK-2 / Fri tuition
    - cron: '55 11 * * *'   # 19:55 KL — night block / Mon-Tue tuition
    - cron: '55 13 * * *'   # 21:55 KL — DEBRIEF
    - cron: '30 14 * * *'   # 22:30 KL — SLEEP final call
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 <<'PYEOF'
          import os, json, urllib.request, urllib.parse
          from datetime import date, datetime, timezone, timedelta
          KL = timezone(timedelta(hours=8))
          now = datetime.now(KL); h = now.hour; wd = now.weekday()
          TOK = os.environ["WAR_BOT_TOKEN"]; CHAT = 1835829454
          EXAMS=[("PA3",date(2026,11,17)),("MathT3",date(2026,11,19)),
                 ("Chem3",date(2026,11,24)),("Phys3",date(2026,11,25))]
          dc=" | ".join(f"{n} D{(d-date.today()).days:+d}" for n,d in EXAMS)
          ROT=["Maths 954/3 — C&R drill","Physics 960/3 — Q21/22 patterns",
               "Maths 954/3 — CI + hyp-test gym","Physics 960/3 — SHM + TOV"]
          mission=ROT[wd%len(ROT)]
          def tg(m,**k):
              urllib.request.urlopen(f"https://api.telegram.org/bot{TOK}/{m}",
                                     urllib.parse.urlencode(k).encode(), timeout=30)
          last=0
          try:
              with urllib.request.urlopen(f"https://api.telegram.org/bot{TOK}/getUpdates?offset=-100&timeout=0",timeout=30) as r:
                  for u in json.loads(r.read()).get("result",[]):
                      m_=u.get("message",{})
                      if m_.get("chat",{}).get("id")==CHAT: last=max(last,m_.get("date",0))
          except Exception: pass
          gap=(now.timestamp()-last)/3600 if last else 999
          if gap>=48: mood="48h of silence, boss. The paper doesn't care how you feel — only whether you showed. Show."
          elif gap>=24: mood="A day dark, boss. One line. Now."
          else: mood="Boss"
          if h==0:   msg=f"{mood}. {dc}. Today's ONE block: {mission}. Ping back when you're up. 🐐"
          elif h==4: msg=f"🌗 Midcheck. Morning: landed or leaked? Block-1 stands at 2pm. {dc}."
          elif h==5: msg=f"⚔️ 5 minutes to BLOCK-1: {mission}. Phone face-down at 2:00."
          elif h==7: msg="✍️ Pens down, Block-1 over. ONE line: what landed. Bad answers welcome. Silence isn't."
          elif h==9:
              if wd==4: msg="🧪 Fizik tuition 5–7 — move now."
              else: msg=f"⚔️ BLOCK-2, 90 min: {mission}. Evening is where marks are stolen."
          elif h==11:
              if wd in (0,1): msg="📚 PA tuition 7:30–9:30 — seated early? Post-class: straight to debrief."
              else: msg="🌙 Night block, 45 min: past-year MCQs or formula-sheet rewrite. Small, but daily."
          elif h==13: msg=f"🌙 DEBRIEF — 3 lines: did / didn't / tomorrow's ONE thing. Sleep law 11pm. {dc}."
          else:      msg="🚨 FINAL CALL: devices down by 11pm. D-COUNT fires 8:55am. Fail forward — report anyway. 🐐"
          tg("sendMessage", chat_id=CHAT, text=msg[:4000])
          print("sent:", msg[:100])
          PYEOF
        env:
          WAR_BOT_TOKEN: ${{ secrets.WAR_BOT_TOKEN }}
