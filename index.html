<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>WAR CHAT · T ⇄ A</title>
<style>
:root{--bg:#0b141a;--panel:#111b21;--bubble-in:#1f2c33;--bubble-out:#005c4b;--txt:#e9edef;--dim:#8696a0;--acc:#00a884;--tick:#53bdeb}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);overflow:hidden}
#login{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:50}
#login .logo{width:84px;height:84px;border-radius:26px;background:linear-gradient(135deg,#005c4b,#00a884);display:flex;align-items:center;justify-content:center;font-size:40px}
#login h1{font-size:20px;letter-spacing:.5px}
#login input{background:var(--panel);border:1px solid #2a3942;color:var(--txt);padding:12px 14px;border-radius:10px;width:250px;font-size:15px;outline:none}
#login button{background:var(--acc);border:0;color:#fff;padding:12px 22px;border-radius:10px;font-size:15px;font-weight:600;width:250px;cursor:pointer}
#login .hint{color:var(--dim);font-size:12px;max-width:270px;text-align:center;line-height:1.5}
#app{display:flex;flex-direction:column;height:100%;max-width:760px;margin:0 auto;border-left:1px solid #222d34;border-right:1px solid #222d34}
header{background:var(--panel);padding:10px 14px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #222d34}
header .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#0e7490,#00a884);display:flex;align-items:center;justify-content:center;font-size:20px}
header .nm{font-weight:600;font-size:15px}
header .st{font-size:12px;color:var(--acc)}
header .sp{flex:1}
.hbtn{background:none;border:0;color:var(--dim);font-size:20px;cursor:pointer;padding:6px}
#feed{flex:1;overflow-y:auto;padding:16px 12px 10px;background:
 radial-gradient(circle at 20% 10%,#111b21 0%,#0b141a 60%)}
.row{display:flex;margin:3px 0}
.row.me{justify-content:flex-end}
.bub{max-width:78%;padding:7px 10px 5px;border-radius:9px;position:relative;word-wrap:break-word;white-space:pre-wrap;font-size:14.5px;line-height:1.42;box-shadow:0 1px 1px rgba(0,0,0,.25)}
.row:not(.me) .bub{background:var(--bubble-in);border-top-left-radius:2px}
.row.me .bub{background:var(--bubble-out);border-top-right-radius:2px}
.meta{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-size:10.5px;color:rgba(233,237,239,.55);margin-top:3px}
.tick{color:var(--tick)}
.bub img{max-width:100%;border-radius:7px;display:block;cursor:pointer}
.bub audio{width:min(240px,60vw);margin:4px 0 2px}
.bub .fn{color:#ffd166;font-size:13px;text-decoration:none;word-break:break-all}
.chip{align-self:center;background:#182229;color:var(--dim);font-size:11.5px;padding:4px 12px;border-radius:8px;margin:10px 0}
.ping{align-self:center;background:linear-gradient(135deg,#7c2d12,#b45309);color:#fff;font-size:13px;padding:6px 14px;border-radius:999px;margin:8px 0}
#typing{height:20px;padding:0 16px;font-size:12px;color:var(--acc);font-style:italic}
footer{background:var(--panel);padding:8px;border-top:1px solid #222d34}
#emoji{display:none;gap:4px;padding:6px 4px;flex-wrap:wrap}
#emoji.on{display:flex}
#emoji button{background:#202c33;border:0;font-size:19px;padding:5px 8px;border-radius:8px;cursor:pointer}
#bar{display:flex;align-items:flex-end;gap:6px}
#bar .ic{background:none;border:0;color:var(--dim);font-size:23px;padding:8px;cursor:pointer}
#bar .ic.rec{color:#f15c6d;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.3}}
#txt{flex:1;background:#2a3942;border:0;border-radius:10px;color:var(--txt);padding:11px 14px;font-size:15px;outline:none;resize:none;max-height:110px}
#send{background:var(--acc);border:0;width:44px;height:44px;border-radius:50%;color:#fff;font-size:18px;cursor:pointer}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
#lightbox img{max-width:95vw;max-height:92vh;border-radius:6px}
#recbar{display:none;align-items:center;gap:10px;background:#2a3942;border-radius:10px;padding:8px 12px}
#recbar .dot{width:10px;height:10px;border-radius:50%;background:#f15c6d;animation:bl 1s infinite}
#recbar .tm{color:var(--txt);font-size:14px;min-width:44px}
#recbar button{background:none;border:0;color:var(--acc);font-weight:600;font-size:14px;cursor:pointer}
#recbar button.x{color:var(--dim)}
#attmenu{display:none;position:absolute;bottom:64px;left:12px;background:#233138;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#attmenu div{padding:12px 18px;cursor:pointer;font-size:14px}
#attmenu div:hover{background:#2a3942}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#f15c6d;color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;display:none;z-index:70}
</style></head><body>
<div id="login">
  <div class="logo">⚔️</div><h1>WAR CHAT</h1>
  <input id="who" placeholder="who are you? (tatharaj)" autocomplete="off">
  <input id="code" type="password" placeholder="passcode" autocomplete="off">
  <button onclick="login()">Open the line</button>
  <div class="hint">Private line between <b>Tatharaj ⇄ Adhithiya</b>. Passcode lives in config.json. Everything is stored in your workspace, nothing leaves it.</div>
</div>
<div id="app" style="display:none">
  <header><div class="av">🤖</div><div><div class="nm">Adhithiya ⚔️</div><div class="st" id="status">online · replies between rounds</div></div><div class="sp"></div>
  <button class="hbtn" onclick="ping()" title="ping">🔔</button></header>
  <div id="feed"></div><div id="typing"></div>
  <footer>
    <div id="emoji"></div>
    <div id="recbar"><span class="dot"></span><span class="tm" id="rectm">0:00</span><span style="color:var(--dim);font-size:13px">recording…</span><span style="flex:1"></span><button class="x" onclick="stopRec(false)">✕</button><button onclick="stopRec(true)">Send ➤</button></div>
    <div id="bar">
      <button class="ic" onclick="toggleEmoji()">😀</button>
      <button class="ic" onclick="toggleAtt()">＋</button>
      <div id="attmenu"><div onclick="pick('image')">🖼️ Image</div><div onclick="pick('file')">📄 File</div><div onclick="startRec()">🎙️ Voice note</div></div>
      <textarea id="txt" rows="1" placeholder="Message"></textarea>
      <button id="send" onclick="send()">➤</button>
    </div>
  </footer>
  <div id="lightbox" onclick="this.style.display='none'"><img id="lbimg"></div>
  <div id="toast"></div>
  <input type="file" id="fpick" hidden>
</div>
<script>
const EMO=['😄','😂','🔥','💪','⚔️','📚','🧪','⚛️','📐','✅','⚠️','🙏','😴','☕','🎯','❤️','👏','🤝','💀','😭','🧠','⏱️','📈','🌙'];
const ME={n:'',code:''};let last=0,timer=null,rec=null,recT=null,recS=0,recChunks=[];
const $=q=>document.querySelector(q);
const feed=$('#feed');
EMO.forEach(e=>{const b=document.createElement('button');b.textContent=e;b.onclick=()=>{$('#txt').value+=e;$('#txt').focus()};$('#emoji').appendChild(b)});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function login(){
  ME.n=$('#who').value.trim().toLowerCase();ME.code=$('#code').value.trim();
  if(ME.n!=='tatharaj'&&ME.n!=='adhithiya')return toast('who? tatharaj or adhithiya');
  if(!ME.code)return toast('passcode needed');
  fetch('/api/poll?since=0',{headers:{'X-Token':ME.code}}).then(r=>{
    if(r.status===401)return toast('wrong passcode');
    $('#login').style.display='none';$('#app').style.display='flex';
    if(ME.n==='tatharaj')setInterval(()=>fetch('/api/seen',{method:'POST',headers:{'X-Token':ME.code,'Content-Type':'application/json'},body:JSON.stringify({mark_from:'adhithiya'})}),4000);
    poll();timer=setInterval(poll,2000);
  });
}
$('#code').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function fmt(t){const d=new Date(t*1000);return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}
function dayKey(t){const d=new Date(t*1000);return d.toLocaleDateString([],{weekday:'short',day:'numeric',month:'short'})}
function render(m){
  const mine=m.from===ME.n;
  const prev=feed.lastElementChild&&feed.lastElementChild.dataset&&feed.lastElementChild.dataset.day;
  const dk=dayKey(m.ts);
  if(prev!==dk){const c=document.createElement('div');c.className='chip';c.dataset.day=dk;c.textContent=dk;feed.appendChild(c)}
  if(m.kind==='ping'){const p=document.createElement('div');p.className='ping';p.textContent=`🔔 ${m.from===ME.n?'You':(m.from==='adhithiya'?'Adhithiya':'Tatharaj')} pinged`;p.dataset.day=dk;feed.appendChild(p);return}
  const row=document.createElement('div');row.className='row'+(mine?' me':'');row.dataset.day=dk;
  let inner='';
  if(m.kind==='image'&&m.media)inner+=`<img src="/media/${m.media}?t=${ME.code}" onclick="lb(this.src)" loading="lazy">`;
  if(m.kind==='audio'&&m.media)inner+=`<audio controls preload="metadata" src="/media/${m.media}?t=${ME.code}"></audio>`;
  if(m.kind==='file'&&m.media)inner+=`<a class="fn" href="/media/${m.media}?t=${ME.code}" download="${esc(m.name||'file')}">📄 ${esc(m.name||'file')} (${Math.round((m.size||0)/1024)} KB)</a>`;
  if(m.text)inner+=`<div>${esc(m.text)}</div>`;
  inner+=`<div class="meta">${fmt(m.ts)}${mine?`<span class="tick" id="t${m.id}">${m.seen?'✓✓':'✓'}</span>`:''}</div>`;
  row.innerHTML=`<div class="bub">${inner}</div>`;
  feed.appendChild(row);
}
function lb(src){$('#lbimg').src=src;$('#lightbox').style.display='flex'}
async function poll(){
  try{
    const r=await fetch('/api/poll?since='+last,{headers:{'X-Token':ME.code}});
    if(r.status!==200)return;
    const j=await r.json();
    let grew=false;
    j.messages.forEach(m=>{last=Math.max(last,m.id);render(m);grew=true});
    if(grew){feed.scrollTop=feed.scrollHeight}
  }catch(e){}
}
async function send(kind='text',extra={}){
  const txt=$('#txt').value.trim();
  const payload={who:ME.n,kind,text:txt,...extra};
  if(kind==='text'&&!txt)return;
  $('#txt').value='';$('#emoji').classList.remove('on');
  const r=await fetch('/api/send',{method:'POST',headers:{'X-Token':ME.code,'Content-Type':'application/json'},body:JSON.stringify(payload)});
  if(r.status===413)return toast('too big — max 10MB');
  const j=await r.json();if(j.message){last=Math.max(last,j.message.id);render(j.message);feed.scrollTop=feed.scrollHeight}
}
$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
function toggleEmoji(){$('#emoji').classList.toggle('on');$('#attmenu').style.display='none'}
function toggleAtt(){const a=$('#attmenu');a.style.display=a.style.display==='block'?'none':'block';$('#emoji').classList.remove('on')}
function pick(kind){
  const f=$('#fpick');f.value='';f.accept=kind==='image'?'image/*':'*/*';
  f.onchange=()=>{
    const file=f.files[0];if(!file)return;
    if(file.size>10_000_000)return toast('max 10MB');
    const rd=new FileReader();
    rd.onload=()=>{
      const isImg=file.type.startsWith('image/');
      send(isImg?'image':'file',{data:rd.result,name:file.name,mime:file.type});
    };
    rd.readAsDataURL(file);$('#attmenu').style.display='none';
  };
  f.click();
}
async function startRec(){
  try{rec=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){return toast('mic blocked — allow it')}
  $('#attmenu').style.display='none';$('#bar').style.display='none';$('#recbar').style.display='flex';
  recChunks=[];recS=Date.now();$('#rectm').textContent='0:00';
  recT=setInterval(()=>{const s=Math.floor((Date.now()-recS)/1000);$('#rectm').textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0');if(s>=120)stopRec(true)},500);
  const mr=new MediaRecorder(rec);
  mr.ondataavailable=e=>recChunks.push(e.data);
  mr.onstop=()=>{
    const blob=new Blob(recChunks,{type:mr.mimeType||'audio/webm'});
    if(blob.size>0&&stopRecSend){
      const rd=new FileReader();
      rd.onload=()=>send('audio',{data:rd.result,name:'voice-note',mime:blob.type});
      rd.readAsDataURL(blob);
    }
    rec.getTracks().forEach(t=>t.stop());rec=null;
  };
  mr.start();window._mr=mr;
}
let stopRecSend=false;
function stopRec(doSend){
  stopRecSend=doSend;$('#recbar').style.display='none';$('#bar').style.display='flex';
  clearInterval(recT);if(window._mr&&window._mr.state!=='inactive')window._mr.stop();
}
async function ping(){await send('ping',{text:''});toast('🔔 pinged Adhithiya')}
</script></body></html>
